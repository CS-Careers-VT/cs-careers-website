name: Validate Prod Build

on:
  pull_request:
    branches:
      - 'production'


jobs:
    build-only:
        name: Prod - PR Build Verification
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'  # Ensures this only runs on PRs
        steps:
            - name: Checkout Repo
              uses: actions/checkout@master

            - name: Initialize Node and Cache Dependencies
              uses: actions/setup-node@master
              with:
                  node-version: 20
                  cache: 'npm'
                  cache-dependency-path: package-lock.json

            - name: Install Dependencies
              run: npm install

            - name: Build Production App
              run: npm run build

            - run: echo "PR Build Verification Successful!"