name: Deploy Development App to Firebase Hosting 

on:
  push:
    branches:
      - 'development'

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Initialize Node and Cache Dependencies
        uses: actions/setup-node@master
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: built-app
          path: dev-build/
  
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build  # Ensures the build step completes before deployment
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: built-app
          path: dev-build/

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_DEV_SA_KEY }}
          PROJECT_ID: "dev-cs-careers-vt-website"
          PROJECT_PATH: "./"

      - run: echo "Deployment Successful!"
