name: Deploy Development App to Firebase Hosting 

on:
  pull_request:
    branches: 
      - 'development'
  push:
    branches:
      - 'development'

jobs:
  fe-build-and-deploy:
    name: Build and Deploy to Development Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Initialize Node and Cache Dependencies
        uses: actions/setup-node@master
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Development App
        run: npm run build
          
        # Deploy app to Firebase
      - name: Deploy app to firebase (dev-cs-careers-vt-website)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_DEV_SA_KEY }}
          PROJECT_ID: "dev-cs-careers-vt-website"
          PROJECT_PATH: "./"

      - run: echo "Deployment Successful!"