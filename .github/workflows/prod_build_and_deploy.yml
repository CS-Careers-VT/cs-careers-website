name: CI/CD Pipeline for Production 

on:
  push:
    branches:
      - 'production'

jobs:
  build-only:
    name: Prod - PR Build Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Ensures this only runs on PRs
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Initialize Node and Cache Dependencies
        uses: actions/setup-node@master
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Production App
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-app
          path: prod-build/


  deploy:
    name: Prod - Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build-only  # Ensures build verification completes first
    if: github.event_name == 'push'  # Ensures this only runs on merges
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: built-app
          path: prod-build/

      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_PROD_SA_KEY }}
          PROJECT_ID: "prod-cs-careers-vt-website"
          PROJECT_PATH: "./"

      - run: echo "Deployment Successful!"
