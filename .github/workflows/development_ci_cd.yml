name: CI/CD Pipeline for Development

on:
  pull_request:
    branches:
      - 'development'
  push:
    branches:
      - 'development'

jobs:
  build-only:
    name: Dev - PR Build Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'  # Ensures this only runs on PRs
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Initialize Node and Cache Dependencies
        uses: actions/setup-node@master
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Development App
        run: npm run build

      - run: echo "PR Build Verification Successful!"


  deploy:
    name: Dev - Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build-only  # Ensures build verification completes first
    if: github.event_name == 'push'  # Ensures this only runs on merges
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master

      - name: Initialize Node and Cache Dependencies
        uses: actions/setup-node@master
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Development App
        run: npm run build

      - name: Deploy to Firebase (dev-cs-careers-vt-website)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_DEV_SA_KEY }}
          PROJECT_ID: "dev-cs-careers-vt-website"
          PROJECT_PATH: "./"

      - run: echo "Deployment Successful!"
